<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Objednávky — Morava Web Studio</title><style>body{font:14px Arial,sans-serif;background:#f7f7f5;color:#171717;margin:0;padding:30px}.box{max-width:1100px;margin:auto}input,button{padding:12px;border:1px solid #ccc;background:white}button{background:#171717;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;background:white;margin-top:22px}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee;vertical-align:top}th{background:#eee}.muted{color:#777}@media(max-width:700px){.tablewrap{overflow:auto}table{min-width:800px}}</style></head><body><div class="box"><h1>Morava Web Studio / Objednávky</h1><p class="muted">Interní přehled poptávek. Přístup chrání heslo nastavené v Netlify.</p><form id="login"><input id="pw" type="password" placeholder="Admin heslo" required><button>Přihlásit</button></form><p id="msg"></p><div class="tablewrap"><table><thead><tr><th>Datum</th><th>Jméno / firma</th><th>Kontakt</th><th>Balíček</th><th>Obor / doplňky</th><th>Popis</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
let token='';const msg=document.getElementById('msg');document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();token=document.getElementById('pw').value;await load();});
async function load(){msg.textContent='Načítám…';try{const r=await fetch('/.netlify/functions/list-orders',{headers:{'Authorization':'Bearer '+token}});const d=await r.json();if(!r.ok)throw Error(d.error||'Přístup odepřen');document.getElementById('rows').innerHTML=d.orders.map(o=>`<tr><td>${esc(o.createdAt||'')}</td><td>${esc(o.name||'')}</td><td>${esc(o.email||'')}<br>${esc(o.phone||'')}</td><td>${esc(o.package||'')}</td><td>${esc(o.business||'')}<br>${esc(o.extras||'')}</td><td>${esc(o.details||'')}</td></tr>`).join('');msg.textContent=`Počet poptávek: ${d.orders.length}`;}catch(e){msg.textContent=e.message;}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
